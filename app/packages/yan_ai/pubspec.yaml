name: yan_ai
description: "砚的端侧推理原生库：把 llama.cpp 与补全桥接层编成 libyan_ai.so / yan_ai.dll。"
version: 0.1.0
publish_to: "none"

environment:
  # 与主应用一致：下界压到 3.6，让鸿蒙那条线（Dart 3.6.2）也能解析。
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  # ffiPlugin: true 是让工具链**构建并打包原生产物**的开关。
  # 没有它，src/CMakeLists.txt 根本不会被调用，运行时也就找不到 libyan_ai.so。
  plugin:
    platforms:
      ohos:
        ffiPlugin: true
