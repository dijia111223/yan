name: yan_note
description: "砚（Yan）— HarmonyOS NEXT 上的开源纯文件本地优先 Markdown 编辑器。"
publish_to: "none"

# 版本号：MAJOR.MINOR.PATCH+BUILD
version: 0.1.0+1

environment:
  # 下界压到 3.6：鸿蒙那条线用的 Flutter 3.27.4 自带 Dart 3.6.2，
  # 而桌面版用的是 Flutter 3.47 / Dart 3.13。同一份代码要能同时编两端，
  # 所以下界取两者中更低的一方（代码里也相应地避开了 Dart 3.9+ 的语法）。
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 依赖版本策略
  # --------------
  # 下界取"代码实际用到的 API 首次出现的版本"，上界放开，让 pub 求解器在**各端各自的
  # Dart 版本**下自动挑最高的兼容版本：
  #   * 桌面（Flutter 3.47 / Dart 3.13）→ 取最新
  #   * 鸿蒙（Flutter 3.27.4 / Dart 3.6）→ 自动降到仍兼容 3.6 的最高版本
  # 因此这里刻意不写死宽松范围（如 ^7.3.1），否则鸿蒙端会因 `requires SDK ^3.9.0` 而求解失败。

  # --- Markdown 解析与预览（GFM：表格 / 任务列表 / 删除线 / 自动链接）---
  markdown: ">=7.2.0 <8.0.0"
  flutter_markdown: ">=0.7.0 <0.8.0"

  # --- LaTeX 公式渲染 ---
  flutter_math_fork: ">=0.7.0 <0.8.0"

  # --- 库选择：桌面用原生目录对话框，Android 走 SAF ---
  file_picker: ">=8.0.0 <13.0.0"

  # --- frontmatter（YAML）读写：raw 保留 + 字段级编辑 ---
  yaml: ">=3.1.0 <4.0.0"
  yaml_edit: ">=2.2.0 <3.0.0"

  # --- 路径处理 ---
  path: ">=1.9.0 <2.0.0"

  # --- UI 状态持久化（记录上次打开的库、视图偏好）---
  #
  # 用 OpenHarmony SIG 的鸿蒙适配分支而非 pub 上的官方包：官方包的 pubspec 里没有
  # `ohos:` 平台声明，鸿蒙端不会注册任何插件（GeneratedPluginRegistrant 是空的），
  # "记住上次打开的库"于是静默失效。该分支声明了 ohos 实现。
  #
  # 不用 git 依赖而用本地 vendor/：这个仓把整套 webview_flutter 的安卓源码都塞在
  # 一处，工作区 109 MB / 8839 个文件，git 依赖要在 PUB_CACHE 里克隆三份（同名分支
  # 也要各存一份 commit），且路径长到需要 core.longpaths。
  # vendor/ 下只留需要的包，约 1 MB。
  shared_preferences:
    path: vendor/shared_preferences/shared_preferences

  # --- 打开外部链接 ---
  url_launcher: ">=6.2.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 注意：这里**刻意不放 integration_test**。
  # 鸿蒙用的 Flutter fork 自报版本号是 `0.0.0-unknown`，而 integration_test 要求
  # Flutter >=3.18，于是它在鸿蒙那条线上会让整个 pub 求解失败。
  # 桌面端要跑集成测试时，用 tool/with_integration_test.ps1 临时加上即可。
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true

  # 库示例：首次启动可作为"试用文件夹"打开的示例笔记
  assets:
    - assets/sample/
